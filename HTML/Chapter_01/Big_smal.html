<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Small</title>
  </head>

  <body>
    <!-- We can make text a bit larger and a bit smaller using <big> and <small> tags 
        respectively. -->
    <big>Hello world</big>
    <small>Hello world</small>
    <hr />

    this <sub> is </sub> subscript. this <sup> is </sup> superscript.
    <br />
    <!-- <br>  used to nex line  -->
    <!-- for example -->
    H<sub>2</sub>O
    <br />
    X<sup>2</sup>+Y
  </body>
</html>
